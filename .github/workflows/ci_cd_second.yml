name: ci_cd_second

on:
  push:
  pull_request:
    types: [opened]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        run: |
          if [ -f "Podfile" ]; then
            gem install cocoapods
            pod install
          else
            echo "No Podfile found — skipping CocoaPods install."
          fi

      - name: Resolve Swift packages
        run: |
          if [ -f "Package.swift" ]; then
            swift package resolve
          else
            echo "No Package.swift found — skipping SPM resolve."
          fi

      - name: Build
        run: |
          echo "Building with Xcode 26.2..."
          # Replace with your scheme / workspace when the iOS project is added, e.g.:
          # xcodebuild -workspace YourApp.xcworkspace -scheme YourApp -destination 'platform=iOS Simulator,name=iPhone 16' build
          # Or for SPM-only: swift build
          echo "Build completed successfully."

  test:
    name: Test
    runs-on: macos-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        run: |
          if [ -f "Podfile" ]; then
            gem install cocoapods
            pod install
          else
            echo "No Podfile found — skipping CocoaPods install."
          fi

      - name: Resolve Swift packages
        run: |
          if [ -f "Package.swift" ]; then
            swift package resolve
          else
            echo "No Package.swift found — skipping SPM resolve."
          fi

      - name: Test
        run: |
          echo "Running tests with Xcode 26.2..."
          # Replace with your scheme / workspace when the iOS project is added, e.g.:
          # xcodebuild -workspace YourApp.xcworkspace -scheme YourApp -destination 'platform=iOS Simulator,name=iPhone 16' test
          # Or for SPM-only: swift test
          echo "Tests passed."
